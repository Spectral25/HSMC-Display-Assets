<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; overflow: hidden; }
  body { height: 100%; overflow-y: scroll; background: #1a1a2e; }
  #scroll-container { height: 500vh; position: relative; }
  #canvas-wrapper { position: sticky; top: 0; width: 100%; height: 100vh; overflow: hidden; }
  #loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #fff; font-family: sans-serif;
    font-size: 16px; letter-spacing: 0.1em;
  }
  #scroll-hint {
    position: absolute; bottom: 40px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.6); font-family: sans-serif;
    font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase;
    animation: fade 2s ease-in-out infinite;
  }
  @keyframes fade { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div id="scroll-container">
  <div id="canvas-wrapper">
    <div id="loading">Loading display...</div>
    <div id="scroll-hint">Scroll to assemble</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const wrapper    = document.getElementById('canvas-wrapper');
const loadingEl  = document.getElementById('loading');
const hintEl     = document.getElementById('scroll-hint');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(45, wrapper.clientWidth / wrapper.clientHeight, 0.1, 100);
camera.position.set(0, 1, 12);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
wrapper.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dir = new THREE.DirectionalLight(0xffffff, 1.2);
dir.position.set(5, 10, 5);
scene.add(dir);
const fill = new THREE.DirectionalLight(0x8888ff, 0.4);
fill.position.set(-5, 0, -5);
scene.add(fill);

let mixer        = null;
let duration     = 0;
let modelLoaded  = false;
let model        = null;
let autoRotY     = 0;
let scrollProg   = 0;
let prevAnimTime = 0;

const loader = new THREE.GLTFLoader();
loader.load(
  'https://spectral25.github.io/HSMC-Display-Assets/HSMC_Display.glb',
  function(gltf) {
    model = gltf.scene;
    const box    = new THREE.Box3().setFromObject(model);
    const centre = box.getCenter(new THREE.Vector3());
    const size   = box.getSize(new THREE.Vector3());
    const scale  = 4 / Math.max(size.x, size.y, size.z);
    model.scale.setScalar(scale);
    model.position.sub(centre.multiplyScalar(scale));
    scene.add(model);

    if (gltf.animations && gltf.animations.length > 0) {
      mixer    = new THREE.AnimationMixer(model);
      duration = gltf.animations[0].duration;
      const action = mixer.clipAction(gltf.animations[0]);
      action.clampWhenFinished = true;
      action.play();
      prevAnimTime = 0;
    }

    loadingEl.style.display = 'none';
    modelLoaded = true;
  },
  function(xhr) {
    if (xhr.total > 0)
      loadingEl.textContent = 'Loading... ' + Math.round(xhr.loaded / xhr.total * 100) + '%';
  },
  function(err) {
    loadingEl.textContent = 'Error loading model.';
    console.error(err);
  }
);

document.body.addEventListener('scroll', () => {
  hintEl.style.opacity = '0';
  const scrollTop = document.body.scrollTop;
  const maxScroll  = document.body.scrollHeight - window.innerHeight;
  scrollProg = maxScroll > 0 ? scrollTop / maxScroll : 0;
});

function animate() {
  requestAnimationFrame(animate);

  if (modelLoaded && model) {
    if (scrollProg < 0.01) {
      autoRotY += 0.005;
      model.rotation.y = autoRotY;
      prevAnimTime = 0;
    } else {
      model.rotation.y = 0;
      if (mixer && duration > 0) {
        const targetTime = Math.min(scrollProg * duration, duration);
        const delta      = targetTime - prevAnimTime;
        mixer.update(delta);
        prevAnimTime = targetTime;
      }
    }
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = wrapper.clientWidth / wrapper.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
});
</script>
</body>
</html>
