<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HSMC Display</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; background: transparent; }
  #scroll-container { height: 500vh; position: relative; width: 100%; }
  #canvas-wrapper {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    overflow: hidden; z-index: 1;
  }
  #loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    color: #fff; font-family: sans-serif; font-size: 16px; z-index: 3;
  }
</style>
</head>
<body>

<div id="scroll-container">
  <div id="canvas-wrapper">
    <div id="loading">Loading display...</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>

const wrapper   = document.getElementById('canvas-wrapper');
const loadingEl = document.getElementById('loading');

// ── Scene (transparent background) ───────────────────────────────────────────
const scene = new THREE.Scene();
// No scene.background set = transparent

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
// Start front-on, closer to model
camera.position.set(0, 1, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0); // Fully transparent
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
wrapper.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0x8888ff, 0.4);
fillLight.position.set(-5, 0, -5);
scene.add(fillLight);

// ── State ─────────────────────────────────────────────────────────────────────
let mixer       = null;
let allActions  = [];
let duration    = 0;
let modelLoaded = false;
let model       = null;
let prevAnimTime = 0;
let scrollProg   = 0;

// ── Load Model ────────────────────────────────────────────────────────────────
const loader = new THREE.GLTFLoader();
loader.load(
  'https://spectral25.github.io/HSMC-Display-Assets/HSMC_Build.glb',

  function(gltf) {
    model = gltf.scene;

    const box    = new THREE.Box3().setFromObject(model);
    const centre = box.getCenter(new THREE.Vector3());
    const size   = box.getSize(new THREE.Vector3());
    // Increase scale value to bring model closer/larger
    const scale  = 5.5 / Math.max(size.x, size.y, size.z);
    model.scale.setScalar(scale);
    model.position.sub(centre.multiplyScalar(scale));
    scene.add(model);

    if (gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(model);
      gltf.animations.forEach(clip => {
        if (clip.duration > duration) duration = clip.duration;
        const action = mixer.clipAction(clip);
        action.play();
        allActions.push(action);
      });
      // Hold at frame 0
      allActions.forEach(a => { a.time = 0; });
      mixer.update(0);
    }

    loadingEl.style.display = 'none';
    modelLoaded = true;
  },

  xhr => {
    if (xhr.total > 0)
      loadingEl.textContent = 'Loading... ' + Math.round(xhr.loaded / xhr.total * 100) + '%';
  },

  err => {
    loadingEl.textContent = 'Error loading model.';
    console.error(err);
  }
);

// ── Scroll ────────────────────────────────────────────────────────────────────
window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY || document.documentElement.scrollTop;
  const maxScroll  = document.documentElement.scrollHeight - window.innerHeight;
  scrollProg = maxScroll > 0 ? scrollTop / maxScroll : 0;
});

// ── Render Loop ───────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);

  if (modelLoaded && model) {

    // Rotate model from front-on (0) to ~50 degrees as user scrolls
    // Full rotation happens over the entire scroll range alongside the explosion
    model.rotation.y = scrollProg * (Math.PI * 0.28);

    // Scrub animation
    if (mixer && duration > 0) {
      const targetTime = Math.max(0, Math.min(scrollProg * duration, duration - 0.001));
      const delta = targetTime - prevAnimTime;
      prevAnimTime = targetTime;
      mixer.update(delta);
    }
  }

  renderer.render(scene, camera);
}
animate();

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
