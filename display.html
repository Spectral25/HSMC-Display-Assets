<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HSMC Display</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; background: transparent; }
  #scroll-container { height: 500vh; position: relative; width: 100%; }
  #canvas-wrapper {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    overflow: hidden; z-index: 1;
  }
  #loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    color: #fff; font-family: sans-serif; font-size: 16px; z-index: 3;
  }
</style>
</head>
<body>

<div id="scroll-container">
  <div id="canvas-wrapper">
    <div id="loading">Loading display...</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>

const wrapper   = document.getElementById('canvas-wrapper');
const loadingEl = document.getElementById('loading');

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 7);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

// Fix for materials appearing black - correct colour space handling
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.physicallyCorrectLights = true;

wrapper.appendChild(renderer.domElement);

// Boosted lighting to make materials visible
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
fillLight.position.set(-5, 2, -5);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xffffff, 0.5);
rimLight.position.set(0, -5, -5);
scene.add(rimLight);

let mixer       = null;
let allActions  = [];
let duration    = 0;
let modelLoaded = false;
let model       = null;
let prevAnimTime = 0;
let scrollProg   = 0;

const loader = new THREE.GLTFLoader();
loader.load(
  'https://spectral25.github.io/HSMC-Display-Assets/HSMC_Build.glb',

  function(gltf) {
    model = gltf.scene;

    // Fix material encoding on every mesh in the model
    model.traverse(child => {
      if (child.isMesh && child.material) {
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(mat => {
          if (mat.map)          mat.map.encoding          = THREE.sRGBEncoding;
          if (mat.emissiveMap)  mat.emissiveMap.encoding  = THREE.sRGBEncoding;
          mat.needsUpdate = true;
        });
      }
    });

    const box    = new THREE.Box3().setFromObject(model);
    const centre = box.getCenter(new THREE.Vector3());
    const size   = box.getSize(new THREE.Vector3());

    const vFov    = camera.fov * (Math.PI / 180);
    const fitScale = (2 * Math.tan(vFov / 2) * 7) / size.y * 0.92;
    model.scale.setScalar(fitScale);
    model.position.sub(centre.multiplyScalar(fitScale));
    scene.add(model);

    if (gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(model);
      gltf.animations.forEach(clip => {
        if (clip.duration > duration) duration = clip.duration;
        const action = mixer.clipAction(clip);
        action.play();
        allActions.push(action);
      });
      allActions.forEach(a => { a.time = 0; });
      mixer.update(0);
    }

    loadingEl.style.display = 'none';
    modelLoaded = true;
  },

  xhr => {
    if (xhr.total > 0)
      loadingEl.textContent = 'Loading... ' + Math.round(xhr.loaded / xhr.total * 100) + '%';
  },

  err => {
    loadingEl.textContent = 'Error loading model.';
    console.error(err);
  }
);

window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY || document.documentElement.scrollTop;
  const maxScroll  = document.documentElement.scrollHeight - window.innerHeight;
  scrollProg = maxScroll > 0 ? scrollTop / maxScroll : 0;
});

function animate() {
  requestAnimationFrame(animate);

  if (modelLoaded && model) {

    // Rotation: 0 to 90 degrees, completes by 40% scroll
    // After that the model stays side-on while explosion continues
    const rotateProg = Math.min(scrollProg / 0.4, 1);
    model.rotation.y = -(rotateProg * (Math.PI / 2));

    if (mixer && duration > 0) {
      const targetTime = Math.max(0, Math.min(scrollProg * duration, duration - 0.001));
      const delta = targetTime - prevAnimTime;
      prevAnimTime = targetTime;
      mixer.update(delta);
    }
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
